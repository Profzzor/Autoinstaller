backend = "xrender"; # backend more compatible, less GPU-heavy
vsync = false; # Syncs frames with monitor refresh rate
shadow = false;
#shadow-radius = 7;
#shadow-opacity = 0.5;
fading = false;
#fade-in-step = 0.03;
#fade-out-step = 0.03;
# Opacity for all windows
active-opacity = 0.95;
inactive-opacity = 0.85;
frame-opacity = 0.9;
inactive-opacity-override = false;
corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'dmenu'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
opacity-rule = [
  "90:class_g = 'mousepad'"
];
